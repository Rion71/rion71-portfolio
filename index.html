<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Alexandra Rion — фотография, дизайн, иллюстрация и кастом."><title>Alexandra Rion — Visual artist</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="scene" aria-hidden="true"><img id="background" src="assets/home-background.jpg" alt="" fetchpriority="high"><canvas id="particles"></canvas><div class="grain"></div></div>
<header><a class="brand" href="#work" aria-label="Rion — главная"><img class="logo-image" src="assets/logo-04-gothic.svg" alt="Rion"></a><nav aria-label="Основное меню"><a href="#work">Works</a><button data-info="about">About</button><button data-info="contact">Contact</button></nav></header>
<main id="work" class="portfolio" aria-label="Направления портфолио">
<button class="project-link photo" data-category="Photo" aria-haspopup="dialog"><span class="cover" style="background-image:url('assets/demo-photo.jpg')"></span><span class="category"><b>01</b> / Photo</span><span class="caption">Photography &amp; video</span></button>
<button class="project-link design" data-category="Design" aria-haspopup="dialog"><span class="cover" style="background-image:url('assets/demo-design.jpg')"></span><span class="category"><b>02</b> / Design</span><span class="caption">Visual identity &amp; graphics</span></button>
<div class="signature"><img class="logo-image hero-logo" src="assets/logo-04-gothic.svg" alt="Монограмма Rion"></div>
<button class="project-link art" data-category="Art" aria-haspopup="dialog"><span class="cover" style="background-image:url('assets/demo-art.jpg')"></span><span class="category"><b>03</b> / Art</span><span class="caption">Illustration &amp; game art</span></button>
<button class="project-link custom" data-category="Custom" aria-haspopup="dialog"><span class="cover" style="background-image:url('assets/demo-custom.jpg')"></span><span class="category"><b>04</b> / Custom</span><span class="caption">Handmade &amp; wearable art</span></button>
<div class="identity"><h1>Alexandra Rion</h1><p>Visual artist</p></div>
</main>
<dialog id="gallery" aria-labelledby="gallery-title"><button class="close" aria-label="Закрыть">Закрыть ×</button><h2 id="gallery-title"></h2><div id="projects" class="projects"></div></dialog>
<script src="app.js"></script><script src="atmosphere.js"></script></body></html>
