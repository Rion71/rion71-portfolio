media:
  input: assets
  output: assets
content:
  - name: portfolio
    label: Портфолио RION
    type: file
    path: content/site.json
    fields:
      - name: intro
        label: Текст первого экрана
        type: text
      - name: about
        label: Об авторе
        type: text
      - name: hero
        label: Фон главной страницы
        type: image
      - name: logo
        label: Логотип
        type: select
        options:
          values: [assets/logo-04-gothic.svg, assets/logo-02-light.svg]
      - name: projects
        label: Проекты
        type: object
        list: true
        fields:
          - name: title
            label: Название
            type: string
            required: true
          - name: category
            label: Папка
            type: select
            required: true
            options:
              values: [Photo, Design, Art, Custom]
          - name: description
            label: Описание
            type: text
          - name: cover
            label: Обложка
            type: image
          - name: images
            label: Фотографии
            type: image
            list: true
          - name: video
            label: Ссылка на видео
            type: string
